[package]
name = "regex-relation-checker"
version = "0.1.2"
edition = "2021"
description = "Check regex overlap, inclusion, equivalence, and emptiness with shortest witnesses"
license = "MIT"

[lib]
name = "regexrel"
path = "src/lib.rs"

[[bin]]
name = "regexrel"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
proptest = "1.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
